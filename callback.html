<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to the app - Je peux ?</title>
<style>
body{font-family:system-ui,sans-serif;max-width:28rem;margin:3rem auto;padding:0 1rem;line-height:1.6;text-align:center}
a.button{display:inline-block;margin-top:1rem;padding:.9rem 1.6rem;border-radius:999px;background:#5b3df5;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<h1>Bank authorisation done</h1>
<p>Returning to the app&hellip; If nothing happens, tap the button below.</p>
<a id="open" class="button" href="jepeux://bank-callback">Open the app</a>
<script>
  // Forwards only the query string (code, state, error) to the app's own scheme.
  var target = "jepeux://bank-callback" + window.location.search;
  document.getElementById("open").setAttribute("href", target);
  window.location.replace(target);
</script>
</body>
</html>
